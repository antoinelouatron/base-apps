<ul>
{% for event in obj %}
    <li>{% if compact %}
    {{event.subj.short_name}} {{event.day_label}} {{event.beghour|slice:":-3"}} 
    {% else %}
    <span class="hidden md:inline">{{event}}</span>
    <span class="md:hidden">{{event.subj.short_name}} {{event.day_label}} {{event.beghour|slice:":-3"}}</span>
    {% endif %}</li>
{% endfor %}
</ul>
